# Configuration Annie — ~/.config/annie/config.toml
# Les clés plates (player, category, filter…) restent supportées pour compatibilité.

[player]
# auto | mpv | vlc | ffplay | chemin absolu vers un exécutable
command = "auto"

[player.mpv]
cache_secs = 30
hwdec = "auto-safe"          # auto | auto-safe | no
vo = "gpu"
gpu_api = "opengl"
really_quiet = true
force_window = true
extra_args = []              # ex. ["--fs"]

[player.vlc]
file_caching_ms = 3000
network_caching_ms = 3000
extra_args = []

[nyaa]
category = "0_0"           # filtre catégorie Nyaa (0_0 = anime)
filter = "0"               # 0 = tous les torrents
search_pages = 2           # pages HTML par recherche
parallel = 10              # requêtes Nyaa parallèles (catalogue)
rate = 6.0                 # requêtes/s max vers nyaa.si
rate_burst = 8
cache_ttl_minutes = 45
sort = "seeders"           # seeders | size | date | downloads
order = "desc"             # asc | desc
timeout = 30.0             # timeout HTTP (secondes)
retries = 4

[mal]
enabled = true             # false = Nyaa seul, sans catalogue MAL/Jikan
parallel = 10
cache_ttl_hours = 168      # cache Jikan (7 jours)

[catalog]
skip_recap_movies = false
fill_gaps_on_search = false  # compléter les épisodes manquants après recherche
search_results_limit = 8     # défaut de `annie search -l`
franchise_max_queries = 20
primary_search_pages = 2
franchise_search_pages = 2
gap_search_pages = 1
gap_max_missing = 6
gap_max_queries = 10
preferred_groups = []        # ex. ["Erai-raws", "SubsPlease"]
preferred_group_bonus = 10   # points qualité ajoutés à ces groupes
min_seeders_strict = 10
min_seeders_relaxed = 3
min_quality_strict = 26      # ~720p
min_quality_relaxed = 12     # ~480p
coverage_relaxed = 0.85
prefer_season_batch = true
season_batch_min_coverage = 0.85
coherence_min_share = 0.60

[subtitles]
enabled = true
default_lang = ""            # ex. "fr" — saute le menu fzf si défini
fetch_timeout = 20.0
api_key = ""                 # https://www.opensubtitles.com/en/consumers
username = ""
password = ""

[ui]
seeders_highlight = 50       # seuil vert dans `annie search`
show_banner = true
mal_pool_workers = 16        # parallélisme MAL + préchauffage Nyaa
show_download_progress = true  # barres terminal pendant la lecture mpv

[streaming]
# Partager l'épisode en cours pendant la lecture (upload illimité sur le fichier lu).
seed_while_watching = true
# Limite upload hors seed (KiB/s). 0 = illimité.
upload_limit_kib = 512

[buffer]
max_wait_sec = 5.0           # attente buffer « idéal »
no_peers_sec = 45.0          # timeout si aucun peer connecté
absolute_sec = 90.0          # timeout absolu avant abandon
mkv_start_mib = 16           # Mo contigus requis pour démarrer un MKV
mkv_head_mib = 16            # priorité téléchargement tête de fichier
stream_margin_mib = 12       # marge lecture / téléchargement (pause mpv)
mpv_retry_sec = 15.0         # réessai si mpv échoue au démarrage
mkv_playable_wait_sec = 8.0

[torrent]
metadata_timeout = 60.0
connections_limit = 300
active_downloads = 1
active_limit = 4
unchoke_slots = 12
unchoke_slots_seeding = 20
enable_dht = true
enable_lsd = true
enable_upnp = true
enable_natpmp = true
