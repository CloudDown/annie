name: Tests

on:
  push:
    branches: [master, cursor/initial-release]
  pull_request:
    branches: [master, cursor/initial-release]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install libtorrent
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-libtorrent

      - name: Install Annie
        run: pip install -e .

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
